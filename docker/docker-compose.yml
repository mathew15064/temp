version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/data:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

  nestjs_be:
    build:
      context: ./node
    container_name: nextjs_fe
    working_dir: /app
    volumes:
      - ../backend:/app
    command: "bun install &&npm run build && npm run start"
    ports:
      - "3001:3001"
    depends_on:
      - mysql

  nextjs_fe:
    build:
      context: ./node
    container_name: nextjs_fe
    working_dir: /app
    volumes:
      - ../frontend:/app
    command: "bun install &&npm run build && npm run start"
    ports:
      - "3000:3000"
